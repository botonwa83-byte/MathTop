name: MathTop
options:
  bundleIdPrefix: com.mathtop
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hans
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MathTop:
    type: application
    platform: iOS
    sources:
      - path: MathTop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathtop.app
        PRODUCT_NAME: MathTop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MathTop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 免加密合规问询：本 App 仅使用 Apple 标准 HTTPS，未使用自有加密
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
  MathTopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MathTop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mathtop.tests
        PRODUCT_NAME: MathTopTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MathTop:
    build:
      targets:
        MathTop: all
        MathTopTests: [test]
    run:
      config: Debug
      storeKitConfiguration: MathTop.storekit
    test:
      config: Debug
      targets:
        - MathTopTests
      storeKitConfiguration: MathTop.storekit
    profile:
      config: Release
      storeKitConfiguration: MathTop.storekit
